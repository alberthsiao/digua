<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5EF">
<title>地瓜打卡</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --paper:#F7F5EF; --ink:#1F2622; --sign:#0B6E4F; --paint:#F4E04D;
  --brick:#B4472E; --dust:#C9C3B2; --mute:#6B6F68;
  --BUILD:"R4.1";
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 12px);
}

header{padding:14px 0 12px;flex:none}
.hd{display:flex;align-items:baseline;gap:10px;padding:0 2px 8px}
.hd b{font-size:15px;font-weight:800;color:var(--sign);letter-spacing:.02em}
.hd span{font-size:12px;color:var(--mute)}

.timer{
  background:#fff;border-radius:12px;padding:12px 16px 14px;
  border-left:5px solid var(--dust)
}
.timer.walking{border-left-color:var(--sign)}
.timer.resting{border-left-color:#6E8090}
.timer.done{border-left-color:var(--ink)}

.badge{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--dust);color:var(--ink);
  border-radius:999px;padding:5px 13px 5px 11px;
  font-size:13.5px;font-weight:800;letter-spacing:.04em
}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.timer.walking .badge{background:var(--sign);color:#fff}
.timer.resting .badge{background:#6E8090;color:#fff}
.timer.done .badge{background:var(--ink);color:var(--paper)}
.timer.walking .badge i,.timer.resting .badge i{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.wx{
  margin-top:8px;background:#fff;border-radius:12px;padding:11px 15px 12px;
  border-left:5px solid var(--dust)
}
.wx.warm{border-left-color:var(--paint)}
.wx.hot{border-left-color:var(--brick)}
.wx.wet{border-left-color:#6E8090}
.wxline{display:flex;align-items:baseline;gap:10px}
.wxline b{font-size:21px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.wxline span{font-size:14px;color:var(--mute);font-weight:600}
.wxTip{margin:5px 0 0;font-size:14px;line-height:1.6;font-weight:600;color:var(--ink)}
.wx.hot .wxTip{color:var(--brick)}

.row2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:9px}
.clock{
  font-size:36px;font-weight:800;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--ink)
}
.timer.resting .clock{color:#6E8090}
.state{font-size:13px;font-weight:600;color:var(--mute);text-align:right;line-height:1.5}

.grid{flex:1;display:grid;grid-template-rows:1fr 1fr 1fr;gap:10px;min-height:0}
.act{
  border:0;border-radius:14px;font-family:inherit;font-size:34px;font-weight:800;
  letter-spacing:.06em;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:6px;cursor:pointer;transition:transform .08s ease;
}
.act small{font-size:13px;font-weight:600;letter-spacing:.02em;opacity:.75}
.act:active{transform:scale(.97)}
.act:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.go{background:var(--sign);color:#fff}
.mark{background:var(--paint);color:var(--ink)}
.done{background:var(--ink);color:var(--paper)}

footer{padding:14px 2px 2px;font-size:13px;line-height:1.6;color:var(--mute);min-height:56px}
footer b{color:var(--ink);font-weight:700}
.pending{color:var(--brick);font-weight:700}
.walking{color:var(--sign);font-weight:800}
.resting{color:#6E8090;font-weight:800}

/* 送出面板 */
.sheet{
  position:fixed;inset:0;background:rgba(31,38,34,.5);
  display:none;align-items:flex-end;z-index:20;
}
.sheet.on{display:flex}
.panel{
  width:100%;background:var(--paper);border-radius:18px 18px 0 0;
  padding:22px 18px calc(env(safe-area-inset-bottom) + 18px);
}
.panel h2{margin:0 0 4px;font-size:26px;font-weight:800;letter-spacing:.04em}
.fix{font-size:13px;color:var(--mute);margin:0 0 16px;min-height:20px}
.fix.bad{color:var(--brick);font-weight:600}
.kmbox{margin-bottom:12px}
.kmbox label{display:block;font-size:14px;font-weight:800;margin-bottom:6px}
.kmbox input{
  width:100%;padding:13px 12px;border:1.5px solid var(--dust);border-radius:10px;
  font-family:inherit;font-size:20px;font-weight:700;background:#fff;color:var(--ink);
  font-variant-numeric:tabular-nums
}
.kmbox input:focus{outline:none;border-color:var(--sign)}
.kmbox p{margin:6px 2px 0;font-size:13px;color:var(--mute);line-height:1.6}

textarea{
  width:100%;min-height:76px;padding:12px;border:1.5px solid var(--dust);
  border-radius:10px;font-family:inherit;font-size:17px;background:#fff;color:var(--ink);resize:none;
}
textarea:focus{outline:none;border-color:var(--sign)}
.photo{margin:12px 0 18px}
.photo label{
  display:inline-block;border:1.5px dashed var(--dust);border-radius:10px;padding:11px 16px;
  font-size:15px;font-weight:600;cursor:pointer;color:var(--mute)
}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumbs figure{position:relative;margin:0}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;display:block}
.thumbs button{
  position:absolute;top:-6px;right:-6px;width:22px;height:22px;border:0;border-radius:50%;
  background:var(--ink);color:var(--paper);font-size:14px;line-height:1;cursor:pointer;
  font-family:inherit;padding:0
}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.row{display:flex;gap:10px}
.row button{
  flex:1;padding:17px;border:0;border-radius:12px;font-family:inherit;
  font-size:18px;font-weight:800;letter-spacing:.05em;cursor:pointer
}
.cancel{background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1.5px var(--dust)}
.send{background:var(--sign);color:#fff;flex:2}
.send[disabled]{opacity:.45}

.msglist{max-height:52vh;overflow-y:auto;margin:14px 0 18px;-webkit-overflow-scrolling:touch}
.msgitem{padding:0 0 15px}
.msgitem .who{font-size:14px;font-weight:800}
.msgitem .who span{font-weight:600;color:var(--mute);font-size:12px;margin-left:7px}
.msgitem .txt{
  font-size:16px;line-height:1.7;margin-top:4px;background:#fff;border-radius:10px;
  padding:11px 13px;border-left:4px solid var(--paint);white-space:pre-wrap;word-break:break-word
}

.toast{
  position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);
  background:var(--ink);color:var(--paper);padding:14px 16px;border-radius:12px;
  font-size:15px;font-weight:600;z-index:40;display:none
}
.toast.on{display:block}
.gate{padding:60px 4px;font-size:16px;line-height:1.8;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hd"><b id="day">環島</b><span id="who"></span></div>
  <div class="timer" id="timer">
    <span class="badge" id="badge"><i></i>尚未出發</span>
    <div class="row2">
      <div class="clock" id="clock">0:00:00</div>
      <div class="state" id="state"></div>
    </div>
  </div>
  <div class="wx" id="wx" hidden>
    <div class="wxline"><b id="wxT">—</b><span id="wxD"></span></div>
    <p class="wxTip" id="wxTip"></p>
  </div>
</header>

<div class="grid" id="grid">
  <button class="act go"   data-type="出發">出發<small>開始計時，寄信給好友</small></button>
  <button class="act mark" data-type="打卡">打卡<small>記位置、拍照，最多 8 張</small></button>
  <button class="act done" data-type="收工">收工<small>今天走完了，留言就是日記</small></button>
</div>

<footer id="foot">尚未打卡。</footer>

<div class="sheet" id="sheet">
  <div class="panel">
    <h2 id="panelTitle">出發</h2>
    <p class="fix" id="fix">正在定位…</p>
    <div class="kmbox" id="kmbox" hidden>
      <label for="km">今天實際走了幾公里？</label>
      <input type="number" id="km" inputmode="decimal" step="0.1" min="0" max="200" placeholder="例如 28.5">
      <p>以你填的為準。不填就用打卡點之間推算的。</p>
    </div>
    <textarea id="note" placeholder="想說的話（可留空）"></textarea>
    <div class="photo">
      <label for="pic" id="picLabel">加照片</label>
      <input type="file" id="pic" accept="image/*" multiple>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="row">
      <button class="cancel" id="cancel">取消</button>
      <button class="send" id="send" disabled>送出</button>
    </div>
  </div>
</div>

<div class="sheet" id="msgs">
  <div class="panel">
    <h2 id="msgsTitle">好友留言</h2>
    <div class="msglist" id="msgList"></div>
    <div class="row"><button class="send" id="msgsOk" style="flex:1">看完了</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxHZleW9xm1otyoOxck_2M5N8Ux_8trtr92LnVCN6cRMkXOsyc2gZ2DTFO-KtngFS5V/exec';
const BUILD = 'R4.1';
const QKEY = 'digua_queue';
const TKEY = 'digua_token';

const $ = function(id){ return document.getElementById(id); };
let token = new URLSearchParams(location.search).get('t') || localStorage.getItem(TKEY) || '';
if (token) localStorage.setItem(TKEY, token);

if (!token) {
  document.body.innerHTML = '<div class="gate">這個網址少了通行碼。<br>請用完整的連結開啟，' +
    '然後「加入主畫面」，之後就不用再輸入。</div>';
  throw new Error('no token');
}

let current = null;   // {type, lat, lng, acc, battery, photo}
let watchId = null;

// ── 打卡流程 ──────────────────────────────
const TYPE_SET = { '出發':1, '打卡':1, '收工':1 };

document.querySelectorAll('.act').forEach(function(btn){
  btn.addEventListener('click', function(){ openPanel(btn.dataset.type); });
});

function openPanel(type){
  current = { type: type, photos: [] };
  $('panelTitle').textContent = type;
  $('note').value = '';
  $('pic').value = '';
  const ph = { '收工':'今天走得怎麼樣？這段話會變成今天的日記',
               '出發':'今天要走去哪？（可留空）' };
  $('note').placeholder = ph[type] || '想說的話（可留空）';
  $('kmbox').hidden = type !== '收工';
  $('km').value = '';
  drawThumbs();
  $('send').disabled = true;
  $('fix').textContent = '正在定位…';
  $('fix').classList.remove('bad');
  $('sheet').classList.add('on');
  saveDraft();
  locate();
  readBattery();
}

$('note').addEventListener('input', saveDraft);
$('km').addEventListener('input', saveDraft);
$('cancel').addEventListener('click', closeSheet);
$('sheet').addEventListener('click', function(e){ if (e.target === $('sheet')) closeSheet(); });

function closeSheet(){
  clearDraft();
  $('sheet').classList.remove('on');
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  current = null;
}

function locate(){
  if (!navigator.geolocation) { fixFail('這台裝置沒有定位功能'); return; }
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  // 用 watchPosition：第一次讀數常常誤差很大，多等幾秒會收斂
  watchId = navigator.geolocation.watchPosition(function(p){
    current.lat = p.coords.latitude;
    current.lng = p.coords.longitude;
    current.acc = p.coords.accuracy;
    $('fix').classList.remove('bad');
    $('fix').textContent = '已定位，誤差約 ' + Math.round(p.coords.accuracy) + ' 公尺';
    $('send').disabled = false;
    if (p.coords.accuracy <= 30 && watchId !== null) {
      navigator.geolocation.clearWatch(watchId); watchId = null;
    }
  }, function(err){
    fixFail(err.code === 1 ? '定位被拒絕，請到手機設定開啟瀏覽器的定位權限'
                           : '收不到定位訊號，換個空曠一點的地方再試');
  }, { enableHighAccuracy:true, timeout:25000, maximumAge:0 });
}

function fixFail(msg){
  $('fix').textContent = msg;
  $('fix').classList.add('bad');
  $('send').disabled = true;
}

function readBattery(){
  if (!navigator.getBattery) return;
  navigator.getBattery().then(function(b){
    if (current) current.battery = Math.round(b.level * 100);
  }).catch(function(){});
}

// ── 照片：先壓縮再送，可多張 ────────────────
const MAX_PHOTOS = 8;
const MAX_EDGE = 1280;

$('pic').addEventListener('change', function(e){
  const files = Array.prototype.slice.call(e.target.files || []);
  e.target.value = '';
  if (!files.length || !current) return;

  const room = MAX_PHOTOS - current.photos.length;
  if (room <= 0) { toast('一次最多 ' + MAX_PHOTOS + ' 張'); return; }
  if (files.length > room) toast('這次只收得下 ' + room + ' 張');

  // 一張一張來。同時解碼好幾張大圖會把 iOS 的記憶體吃爆，
  // 分頁被回收就是他遇到的「跳掉」。
  const queue = files.slice(0, room);
  $('picLabel').textContent = '處理中…';
  (function next(){
    if (!queue.length || !current) { drawThumbs(); return; }
    shrink(queue.shift(), function(data){
      if (current && data) { current.photos.push(data); saveDraft(); }
      drawThumbs();
      setTimeout(next, 60);   // 讓瀏覽器有空回收上一張
    });
  })();
});

/**
 * 壓縮一張照片。
 * LINE 傳來的原檔可能有 4000×3000，用 new Image() 解碼會整張攤進記憶體（約 48MB）。
 * createImageBitmap 可以在解碼當下就縮小，記憶體差一個數量級。
 * 不支援的瀏覽器退回舊做法。
 */
function shrink(file, done){
  const fallback = function(){
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function(){
      const s = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let out = null;
      try { out = c.toDataURL('image/jpeg', 0.72); } catch (err) { toast('有一張照片轉檔失敗'); }
      c.width = c.height = 0;
      done(out);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); toast('有一張照片讀不出來'); done(null); };
    img.src = url;
  };

  if (!window.createImageBitmap) { fallback(); return; }

  createImageBitmap(file).then(function(bmp){
    const s = Math.min(1, MAX_EDGE / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);
    return createImageBitmap(bmp, { resizeWidth: w, resizeHeight: h, resizeQuality: 'high' })
      .catch(function(){ return bmp; })
      .then(function(small){
        const c = document.createElement('canvas');
        c.width = small.width <= w ? small.width : w;
        c.height = small.height <= h ? small.height : h;
        c.getContext('2d').drawImage(small, 0, 0, c.width, c.height);
        const data = c.toDataURL('image/jpeg', 0.72);
        c.width = c.height = 0;
        if (small.close) small.close();
        if (bmp !== small && bmp.close) bmp.close();
        done(data);
      });
  }).catch(function(){ fallback(); });
}

// ── 草稿：iOS 可能在選照片時把分頁回收，回來要能接上 ──
const DKEY = 'digua_draft';

function saveDraft(){
  if (!current) { localStorage.removeItem(DKEY); return; }
  try {
    localStorage.setItem(DKEY, JSON.stringify({
      at: Date.now(), type: current.type,
      note: $('note').value, km: $('km').value,
      photos: current.photos
    }));
  } catch (err) {
    // 空間不夠就別存照片，至少把類型和文字留住
    try {
      localStorage.setItem(DKEY, JSON.stringify({
        at: Date.now(), type: current.type,
        note: $('note').value, km: $('km').value, photos: []
      }));
    } catch (e2) {}
  }
}

function clearDraft(){ localStorage.removeItem(DKEY); }

function restoreDraft(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(DKEY)); } catch (e) {}
  if (!d || !d.type || !TYPE_SET[d.type]) return;
  if (Date.now() - d.at > 2 * 3600 * 1000) { clearDraft(); return; }   // 兩小時前的就算了

  openPanel(d.type);
  current.photos = d.photos || [];
  $('note').value = d.note || '';
  $('km').value = d.km || '';
  drawThumbs();
  toast('剛才那筆還沒送出，幫你留著了');
}

function drawThumbs(){
  const box = $('thumbs');
  const list = (current && current.photos) || [];
  box.innerHTML = list.map(function(d, i){
    return '<figure><img src="' + d + '" alt=""><button type="button" data-i="' + i + '">×</button></figure>';
  }).join('');
  box.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){
      current.photos.splice(Number(b.dataset.i), 1);
      saveDraft();
      drawThumbs();
    });
  });
  $('picLabel').textContent = list.length ? '再加照片（已選 ' + list.length + ' 張）' : '加照片';
}

// ── 送出 ──────────────────────────────────
$('send').addEventListener('click', function(){
  if (!current || current.lat == null) return;
  const rec = {
    action:'checkin', token:token, cid:uuid(), ts:new Date().toISOString(),
    type:current.type, lat:current.lat, lng:current.lng, acc:current.acc,
    battery:current.battery, note:$('note').value.trim(), photos:current.photos
  };
  if (current.type === '收工') {
    const km = parseFloat($('km').value);
    if (isFinite(km) && km > 0) rec.km = km;
  }
  enqueue(rec);
  clearDraft();
  closeSheet();
  toast(rec.type + '已記錄');
  render();
  flush();
});

// ── 佇列：沒訊號也吞得下 ──────────────────
function queue(){ try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch(e){ return []; } }

function saveQueue(q){
  try { localStorage.setItem(QKEY, JSON.stringify(q)); return true; }
  catch(e){
    // 空間不足：捨棄照片保住紀錄，位置和時間比照片重要
    q.forEach(function(r){ r.photos = []; r.photo = null; });
    try { localStorage.setItem(QKEY, JSON.stringify(q)); toast('空間不足，這幾筆的照片沒留住'); return true; }
    catch(e2){ return false; }
  }
}

function enqueue(rec){ const q = queue(); q.push(rec); saveQueue(q); }

let flushing = false;
function flush(){
  if (flushing) return;
  const q = queue();
  if (!q.length) return;
  flushing = true;
  const rec = q[0];
  fetch(API_URL, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(rec)
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    flushing = false;
    if (res && res.ok) {
      const rest = queue().filter(function(x){ return x.cid !== rec.cid; });
      saveQueue(rest);
      localStorage.setItem('digua_last', JSON.stringify({
        type: rec.type, ts: rec.ts, addr: res.addr || '', wx: res.wx || '',
        lat: rec.lat, lng: rec.lng
      }));
      if (res.today) localStorage.setItem('digua_today', JSON.stringify(
        Object.assign({ at: Date.now() }, res.today)));
      tick();
      loadWx(rec.lat, rec.lng);
      if (res.newMsgs && res.newMsgs.length) showMsgs(res.newMsgs);
      render();
      flush();
    } else {
      toast('伺服器回報：' + ((res && res.error) || '未知錯誤'));
      render();
    }
  })
  .catch(function(){ flushing = false; render(); });
}

window.addEventListener('online', flush);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) flush(); });

// ── 畫面狀態 ──────────────────────────────
function render(){
  const n = queue().length;
  let last = null;
  try { last = JSON.parse(localStorage.getItem('digua_last')); } catch(e){}

  let html = '';
  if (last) {
    const d = new Date(last.ts);
    html += '上次 <b>' + last.type + '</b>　' +
            d.toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    if (last.wx) html += '　' + last.wx;
    if (last.addr) html += '<br>' + last.addr;
  } else {
    html += '還沒有打卡紀錄。';
  }
  if (n) html += '<br><span class="pending">還有 ' + n + ' 筆等訊號，回到有網路的地方會自動補送</span>';
  $('foot').innerHTML = html;
  tick();
}

function showMsgs(list){
  $('msgsTitle').textContent = list.length === 1 ? '有一則新留言' : '有 ' + list.length + ' 則新留言';
  $('msgList').innerHTML = list.map(function(m){
    return '<div class="msgitem"><div class="who">' + esc(m.name) +
           '<span>' + new Date(m.t).toLocaleString('zh-TW',
             {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) + '</span></div>' +
           '<div class="txt">' + esc(m.text) + '</div></div>';
  }).join('');
  $('msgs').classList.add('on');
}
$('msgsOk').addEventListener('click', function(){ $('msgs').classList.remove('on'); });

function esc(t){
  return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
  });
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}

/** 讀今天的狀態，過了午夜就作廢 */
function todayState(){
  let t = null;
  try { t = JSON.parse(localStorage.getItem('digua_today')); } catch(e){}
  if (!t || !sameDay(t.at)) return null;
  const gone = Math.max(0, Math.round((Date.now() - t.at) / 1000));
  return {
    walk: (t.walkSec || t.walkMin * 60 || 0) + (t.resting || t.done ? 0 : gone),
    rest: (t.restSec || t.restMin * 60 || 0) + (t.resting ? gone : 0),
    resting: !!t.resting,
    done: !!t.done
  };
}

function hms(sec){
  const h = Math.floor(sec / 3600);
  const m = Math.floor(sec % 3600 / 60);
  const s2 = Math.floor(sec % 60);
  return h + ':' + String(m).padStart(2, '0') + ':' + String(s2).padStart(2, '0');
}

/** 每秒跳一次 */
function tick(){
  const t = todayState();
  const box = $('timer');
  box.className = 'timer';

  if (!t) {
    setTimer('尚未出發', '0:00:00', '按「出發」開始計時');
    return;
  }
  if (t.done) {
    box.classList.add('done');
    setTimer('今天收工', hms(t.walk), '辛苦了');
    return;
  }
  box.classList.add('walking');
  setTimer('在路上', hms(t.walk), '從出發到現在');
}

function setTimer(label, clock, note){
  $('badge').innerHTML = '<i></i>' + label;
  $('clock').textContent = clock;
  $('state').textContent = note;
}

function hm(min){
  const h = Math.floor(min / 60), m = min % 60;
  if (h && m) return h + ' 小時 ' + m + ' 分';
  if (h) return h + ' 小時';
  return m + ' 分';
}

function sameDay(ts){
  const a = new Date(ts), b = new Date();
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

// ── 天氣與補水 ──────────────────────────
const WMO = {
  0:'晴', 1:'大致晴朗', 2:'多雲時晴', 3:'陰',
  45:'有霧', 48:'霧淞',
  51:'毛毛雨', 53:'毛毛雨', 55:'毛毛雨', 56:'凍雨', 57:'凍雨',
  61:'小雨', 63:'中雨', 65:'大雨', 66:'凍雨', 67:'凍雨',
  71:'小雪', 73:'中雪', 75:'大雪', 77:'霰',
  80:'陣雨', 81:'陣雨', 82:'強陣雨', 85:'陣雪', 86:'強陣雪',
  95:'雷雨', 96:'雷雨帶冰雹', 99:'強雷雨帶冰雹'
};

function loadWx(lat, lng){
  if (lat == null || lng == null) {
    let last = null;
    try { last = JSON.parse(localStorage.getItem('digua_last')); } catch(e){}
    if (!last || last.lat == null) return;
    lat = last.lat; lng = last.lng;
  }
  fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lng +
        '&current=temperature_2m,apparent_temperature,weather_code,precipitation' +
        '&timezone=Asia%2FTaipei')
    .then(function(r){ return r.json(); })
    .then(function(j){
      const c = (j && j.current) || {};
      if (c.temperature_2m == null) return;
      const w = {
        t: Math.round(c.temperature_2m * 10) / 10,
        feels: c.apparent_temperature == null ? null : Math.round(c.apparent_temperature),
        desc: WMO[c.weather_code] || '',
        rain: (c.precipitation || 0) > 0,
        at: Date.now()
      };
      localStorage.setItem('digua_wx', JSON.stringify(w));
      showWx();
    })
    .catch(function(){});
}

function showWx(){
  let w = null;
  try { w = JSON.parse(localStorage.getItem('digua_wx')); } catch(e){}
  const box = $('wx');
  if (!w || Date.now() - w.at > 3 * 3600 * 1000) { box.hidden = true; return; }

  box.hidden = false;
  box.className = 'wx';
  $('wxT').textContent = w.t + '°C';
  $('wxD').textContent = (w.desc || '') +
    (w.feels != null && Math.abs(w.feels - w.t) >= 2 ? '　體感 ' + w.feels + '°C' : '');

  const f = (w.feels != null ? w.feels : w.t);
  let tip;
  if (f >= 34) {
    box.classList.add('hot');
    tip = '很熱。每 15 到 20 分鐘喝幾口水，別等到口渴。頭暈、起雞皮疙瘩或不流汗就馬上找陰涼處坐下。';
  } else if (f >= 30) {
    box.classList.add('warm');
    tip = '偏熱，每 20 到 30 分鐘補一次水。中午那幾個小時盡量走有遮蔭的一側。';
  } else if (w.rain || (w.desc && w.desc.indexOf('雨') >= 0)) {
    box.classList.add('wet');
    tip = '有雨，路面濕滑。天氣涼不代表不會脫水，還是要定時喝水。';
  } else if (f <= 14) {
    box.classList.add('wet');
    tip = '偏冷。冷天一樣會流失水分，記得定時補水，休息時別把汗濕的衣服穿著吹風。';
  } else {
    tip = '走起來舒服。每 30 分鐘喝一次水，維持節奏。';
  }
  $('wxTip').textContent = tip;
}

function uuid(){
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'x' + Date.now() + Math.random().toString(16).slice(2);
}
