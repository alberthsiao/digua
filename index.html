<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E4F">
<title>陳地瓜走到哪</title>
<meta property="og:title" content="陳地瓜走到哪">
<meta property="og:description" content="陳地瓜 9 月 5 日從台南出發，徒步環島。這裡有他現在的位置、每天走過的路，和沿路拍的照片。">
<meta property="og:image" content="https://alberthsiao.github.io/digua/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="digua.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --paper:#F7F5EF; --ink:#1F2622; --sign:#0B6E4F; --paint:#F4E04D;
  --brick:#B4472E; --dust:#C9C3B2; --mute:#6B6F68;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  display:flex;flex-direction:column;
}

#map{height:48vh;min-height:250px;background:var(--dust);z-index:0;position:relative;flex:none}

.milestone{
  position:absolute;left:12px;top:12px;z-index:500;
  background:var(--sign);color:#fff;border-radius:4px;
  border:2px solid #fff;box-shadow:0 2px 10px rgba(31,38,34,.28);padding:9px 15px 10px;
}
.milestone .km{font-size:31px;font-weight:800;line-height:1;letter-spacing:-.01em}
.milestone .km i{font-style:normal;font-size:14px;font-weight:700;margin-left:3px}
.milestone .sub{font-size:12px;opacity:.85;margin-top:3px}

.days{
  display:flex;gap:7px;overflow-x:auto;padding:12px 16px;flex:none;
  background:var(--paper);border-bottom:1px solid var(--dust);
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.days::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1.5px solid var(--dust);background:#fff;border-radius:5px;
  padding:7px 11px;font-family:inherit;font-size:13px;font-weight:700;color:var(--mute);
  cursor:pointer;white-space:nowrap;line-height:1.35;text-align:center
}
.chip em{display:block;font-style:normal;font-size:11px;font-weight:600;opacity:.75;margin-top:1px}
.chip[aria-pressed=true]{background:var(--sign);border-color:var(--sign);color:#fff}
.chip.city{font-weight:800}
.chip.day{background:var(--paper);border-style:dashed;font-weight:700}
.chip .dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:5px;vertical-align:1px
}
.chip.mode{background:var(--paper);border-color:var(--ink);color:var(--ink);font-weight:800}
.chip.day[aria-pressed=true]{background:var(--ink);border-color:var(--ink);border-style:solid;color:#fff}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.feed{padding:20px 18px 40px}

@media(min-width:900px){
  body{flex-direction:row}
  .left{flex:1.5;display:flex;flex-direction:column;height:100vh}
  #map{height:100%;flex:1}
  .right{flex:1;max-width:540px;display:flex;flex-direction:column;height:100vh;border-left:1px solid var(--dust)}
}

.now{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:22px}
.now .label{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--sign);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.badge[hidden]{display:none}
.badge{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;
  padding:4px 11px 4px 9px;font-size:12px;font-weight:800;letter-spacing:.04em
}
.badge:empty{display:none}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.walking{background:var(--sign);color:#fff}
.badge.resting{background:#6E8090;color:#fff}
.badge.done{background:var(--ink);color:var(--paper)}
.badge.walking::before,.badge.resting::before{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.now .place{font-size:26px;font-weight:800;line-height:1.28;margin:5px 0 4px}
.now .when{font-size:14px;color:var(--mute)}

.day{margin-bottom:34px;padding-left:14px}
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.dayhead .n{font-size:23px;font-weight:800;letter-spacing:-.01em}
.dayhead .date{font-size:14px;color:var(--mute)}
.route{font-size:15px;font-weight:600;line-height:1.6;margin:2px 0 6px}
.route span{color:var(--dust);font-weight:800;margin:0 5px}
.stat{font-size:13px;color:var(--mute);margin-bottom:14px;font-variant-numeric:tabular-nums}
.diary{
  font-size:16.5px;line-height:1.85;background:#fff;border-radius:10px;
  padding:15px 16px;margin:0 0 18px;border-left:4px solid var(--paint)
}

.entry{display:grid;grid-template-columns:50px 1fr;gap:12px;padding-bottom:20px}
.entry .t{font-size:13.5px;color:var(--mute);padding-top:3px;font-variant-numeric:tabular-nums}
.entry .body{border-left:3px solid var(--dust);padding-left:13px}
.entry .kind{font-size:12.5px;font-weight:800;letter-spacing:.05em}
.entry .addr{font-size:16.5px;font-weight:600;margin-top:2px;line-height:1.5}
.entry .wx{font-size:13.5px;color:var(--mute);margin-top:3px}
.entry .note{font-size:16px;line-height:1.75;margin-top:7px}
.entry img{
  width:100%;border-radius:8px;margin-top:11px;display:block;
  background:var(--dust);cursor:zoom-in;aspect-ratio:4/3;object-fit:cover
}
.ph{position:relative;display:block}
.ph b{
  position:absolute;right:7px;bottom:7px;background:rgba(31,38,34,.82);color:var(--paper);
  font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;pointer-events:none
}
.ph b::before{content:"💬 "}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:11px}
.strip img,.strip .ph img{margin-top:0;aspect-ratio:1;border-radius:6px}
.strip .ph{margin-top:0}
.strip img:only-child{grid-column:1/-1;aspect-ratio:4/3}

.board{margin-bottom:24px}
.compose{background:#fff;border-radius:12px;padding:15px 16px 16px;margin-bottom:22px}
.compose input,.compose textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--dust);border-radius:9px;
  font-family:inherit;font-size:16px;background:var(--paper);color:var(--ink);margin-bottom:9px
}
.compose textarea{min-height:78px;resize:none;line-height:1.6}
.compose input:focus,.compose textarea:focus{outline:none;border-color:var(--sign)}
.compose button{
  width:100%;padding:14px;border:0;border-radius:10px;background:var(--sign);color:#fff;
  font-family:inherit;font-size:16px;font-weight:800;letter-spacing:.04em;cursor:pointer
}
.compose button[disabled]{opacity:.5}
.compose .hint{font-size:13px;color:var(--mute);margin:10px 2px 0;line-height:1.6}
.compose .err{color:var(--brick);font-weight:700}

.msg{padding:0 0 20px}
.msg .who{font-size:15px;font-weight:800}
.msg .who span{font-weight:600;color:var(--mute);font-size:13px;margin-left:8px}
.msg .txt{
  font-size:16px;line-height:1.75;margin-top:5px;background:#fff;
  border-radius:10px;padding:12px 14px;border-left:4px solid var(--paint);
  white-space:pre-wrap;word-break:break-word
}

.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 -18px 24px}
.wall .ph{display:block}
.wall img{
  width:100%;aspect-ratio:1;object-fit:cover;display:block;
  background:var(--dust);cursor:zoom-in
}
.wall .day{
  grid-column:1/-1;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--mute);
  padding:16px 18px 6px;margin:0;border-top:1px solid var(--dust)
}
.wall .day:first-child{border-top:0;padding-top:0}
.wallhead{font-size:13px;color:var(--mute);margin:0 0 16px}

.cta{
  display:block;background:var(--ink);color:var(--paper);text-decoration:none;
  padding:17px;border-radius:12px;font-size:16px;font-weight:700;text-align:center
}
.foot{font-size:12px;color:var(--mute);margin-top:14px;text-align:center}
.empty{color:var(--mute);font-size:16px;line-height:1.8;padding:16px 0}

.pin{border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.facepick{
  position:absolute;left:12px;bottom:16px;z-index:500;display:flex;gap:6px;
  background:rgba(247,245,239,.92);border-radius:999px;padding:5px;
  box-shadow:0 2px 8px rgba(31,38,34,.22)
}
.facepick button{
  width:32px;height:32px;padding:0;border:2px solid transparent;border-radius:50%;
  background:none;cursor:pointer;overflow:hidden;line-height:0
}
.facepick button img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover}
.facepick button[aria-pressed=true]{border-color:var(--ink)}

.avatar{
  width:100%;height:100%;border-radius:50%;display:block;
  border:3px solid #fff;box-shadow:0 3px 10px rgba(31,38,34,.42);
  background:var(--paper)
}
.here{position:relative}
.here::after{
  content:"";position:absolute;inset:-8px;border-radius:50%;
  border:2.5px solid var(--brick);animation:ping 2.4s ease-out infinite
}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.here::after{animation:none;opacity:.5}}
.leaflet-container{font-family:inherit}

.lb{
  position:fixed;inset:0;background:rgba(31,38,34,.94);z-index:900;
  display:none;overflow-y:auto;-webkit-overflow-scrolling:touch
}
.lb.on{display:block}
.lbbox{max-width:560px;margin:0 auto;padding:52px 16px calc(env(safe-area-inset-bottom) + 32px)}
.lb img{width:100%;max-height:70vh;object-fit:contain;border-radius:6px;display:block}
.lb .cap{color:var(--paper);font-size:14px;line-height:1.6;padding:12px 2px 0;opacity:.85}
.lbx{
  position:fixed;top:12px;right:14px;z-index:20;width:38px;height:38px;border:0;border-radius:50%;
  background:rgba(247,245,239,.16);color:var(--paper);font-size:24px;line-height:1;
  cursor:pointer;font-family:inherit
}
.lbmsgs{margin-top:20px;border-top:1px solid rgba(247,245,239,.22);padding-top:18px}
.lbmsgs .msg .who{color:var(--paper)}
.lbmsgs .msg .who span{color:rgba(247,245,239,.6)}
.lbcompose{background:rgba(247,245,239,.08)}
.lbcompose input,.lbcompose textarea{
  background:rgba(247,245,239,.1);border-color:rgba(247,245,239,.28);color:var(--paper)
}
.lbcompose input::placeholder,.lbcompose textarea::placeholder{color:rgba(247,245,239,.5)}
.lbcompose .hint{color:rgba(247,245,239,.6)}
.lbcompose textarea{min-height:64px}
</style>
</head>
<body>

<div class="left">
  <div id="map">
    <div class="milestone"><div class="km">—<i>km</i></div><div class="sub">載入中</div></div>
    <div class="facepick" id="facepick" aria-label="換一個地瓜">
      <button type="button" data-face="photo"><img src="digua.png" alt="手繪頭像"></button>
      <button type="button" data-face="potato"><img src="marker-potato.png" alt="番薯"></button>
      <button type="button" data-face="typhoon"><img src="marker-typhoon.png" alt="颱風"></button>
      <button type="button" data-face="runner"><img src="marker-runner.png" alt="一個人在跑"></button>
    </div>
  </div>
</div>

<div class="right">
  <div class="days" id="days"></div>
  <div class="scroll" id="scroll">
    <div class="feed">
      <div class="now">
        <div class="label"><span id="label">地瓜現在在</span><span class="badge" id="badge" hidden></span></div>
        <div class="place" id="place">正在讀取…</div>
        <div class="when" id="when"></div>
      </div>
      <div id="list"></div>
      <a class="cta" href="subscribe.html">用 Email 追地瓜</a>
      <div class="foot" id="foot"></div>
    </div>
  </div>
</div>

<div class="lb" id="lb">
  <button class="lbx" id="lbClose" type="button" aria-label="關閉">×</button>
  <div class="lbbox" id="lbbox">
    <img id="lbimg" alt="">
    <div class="cap" id="lbcap"></div>
    <div class="lbmsgs">
      <div id="lbList"></div>
      <div class="compose lbcompose">
        <input id="pName" maxlength="20" placeholder="你的名字" autocomplete="name">
        <textarea id="pText" maxlength="300" placeholder="對這張照片說點什麼"></textarea>
        <button id="pGo">留言</button>
        <p class="hint" id="pHint"></p>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxHZleW9xm1otyoOxck_2M5N8Ux_8trtr92LnVCN6cRMkXOsyc2gZ2DTFO-KtngFS5V/exec';
const BUILD = 'R3.9';

const COLORS = { '出發':'#0B6E4F', '打卡':'#C99A1E', '休息':'#6E8090', '收工':'#1F2622' };
const $ = function(id){ return document.getElementById(id); };

const map = L.map('map', { zoomControl:false }).setView([23.7, 121.0], 7);
L.control.zoom({ position:'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'&copy; OpenStreetMap'
}).addTo(map);

const layer = L.layerGroup().addTo(map);
let DATA = null;      // 後端原始資料
let DAYS = [];        // 依日期分好的每一天
let sel = null;       // 選中的第幾天；null = 全程
let LEGS = [];        // 分好的路段
let GROUP = localStorage.getItem('digua_group') === 'week' ? 'week' : 'city';

const FACES = { photo:'digua.png', potato:'marker-potato.png',
                typhoon:'marker-typhoon.png', runner:'marker-runner.png' };
let FACE = FACES[localStorage.getItem('digua_face')] ? localStorage.getItem('digua_face') : 'photo';

document.querySelectorAll('.facepick button').forEach(function(b){
  b.setAttribute('aria-pressed', String(b.dataset.face === FACE));
  b.addEventListener('click', function(){
    FACE = b.dataset.face;
    localStorage.setItem('digua_face', FACE);
    document.querySelectorAll('.facepick button').forEach(function(x){
      x.setAttribute('aria-pressed', String(x.dataset.face === FACE));
    });
    if (DATA) drawMap();
  });
});
let booted = false;   // 是否已完成第一次載入
let refit = true;     // 這次要不要重新框地圖範圍

function typing(){
  const a = document.activeElement;
  return !!(a && (a.id === 'mText' || a.id === 'mName'));
}

function load(after){
  fetch(API_URL + '?api=feed&_=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res || !res.ok) throw new Error('bad');
      DATA = res.data;
      DAYS = groupByDay(DATA);
      if (!booted) { sel = fromHash(); refit = true; booted = true; }
      if (sel !== null && typeof sel !== 'string' && !dayOf(sel)) sel = null;
      if ($('lb').classList.contains('on')) {   // 燈箱開著就別動底下的畫面
        if (after) after();
        return;
      }
      if (typing()) { drawBoard(); return; }   // 打字中只補留言，其餘不動
      renderAll();
      refit = false;
      if (after) after();
    })
    .catch(function(){
      if (!booted) $('place').textContent = '連不上伺服器，稍後會自動再試';
    });
}

function fromHash(){
  const m = location.hash.match(/^#d(\d+)$/);
  if (m) return Number(m[1]);
  if (location.hash === '#photos') return 'wall';
  if (location.hash === '#board') return 'board';
  if (location.hash.indexOf('#leg:') === 0) return location.hash.slice(1);
  if (location.hash === '#all') return null;
  return DAYS.length ? DAYS[DAYS.length - 1].no : null;   // 預設看最新的一天
}

function groupByDay(d){
  const start = new Date(d.startDate + 'T00:00:00+08:00');
  const buckets = {};
  (d.points || []).forEach(function(p){
    const dt = new Date(p.t);
    const key = dt.getFullYear() + '-' + (dt.getMonth() + 1) + '-' + dt.getDate();
    if (!buckets[key]) buckets[key] = { key:key, date:dt, pts:[] };
    buckets[key].pts.push(p);
  });
  return Object.keys(buckets).map(function(k){
    const g = buckets[k];
    const midnight = new Date(g.date.getFullYear(), g.date.getMonth(), g.date.getDate());
    g.no = Math.max(1, Math.round((midnight - start) / 86400000) + 1);
    g.km = g.pts.reduce(function(s, p){ return s + (p.km || 0); }, 0);
    const key = g.date.getFullYear() + '-' +
                String(g.date.getMonth() + 1).padStart(2, '0') + '-' +
                String(g.date.getDate()).padStart(2, '0');
    if (d.manual && d.manual[key] != null) { g.km = d.manual[key]; g.manual = true; }
    g.from = g.pts[0].addr || '';
    g.to = g.pts[g.pts.length - 1].addr || '';
    Object.assign(g, hoursOf(g.pts));
    // 收工那筆的留言就是當天的日記
    const wrap = g.pts.filter(function(p){ return p.type === '收工' && p.note; }).pop();
    g.diary = wrap ? wrap.note : '';
    g.diaryFrom = wrap || null;
    return g;
  }).sort(function(a, b){ return a.date - b.date; });
}

/** 行走時數：首筆到收工（未收工算到現在），扣掉每段休息 */
function hoursOf(pts){
  const t0 = new Date(pts[0].t);
  const done = pts.filter(function(p){ return p.type === '收工'; }).pop();
  const isToday = sameDay(t0);
  const t1 = done ? new Date(done.t) : (isToday ? new Date() : new Date(pts[pts.length-1].t));

  // 休息到下一次「出發」或「收工」為止；中間的「打卡」不算恢復
  let rest = 0, resting = false;
  for (let i = 0; i < pts.length; i++) {
    if (pts[i].type !== '休息') continue;
    const from = new Date(pts[i].t);
    let end = null;
    for (let j = i + 1; j < pts.length; j++) {
      if (pts[j].type === '出發' || pts[j].type === '收工') { end = new Date(pts[j].t); break; }
    }
    rest += Math.max(0, (end || t1) - from);
    if (!end) resting = !done;
  }
  return {
    walkMin: Math.max(0, Math.round(((t1 - t0) - rest) / 60000)),
    restMin: Math.round(rest / 60000),
    resting: resting && isToday,
    done: !!done
  };
}

function sameDay(d){
  const b = new Date();
  return d.getFullYear() === b.getFullYear() && d.getMonth() === b.getMonth() && d.getDate() === b.getDate();
}

function hm(min){
  const h = Math.floor(min / 60), m = min % 60;
  if (h && m) return h + ' 小時 ' + m + ' 分';
  if (h) return h + ' 小時';
  return m + ' 分';
}

/** 從「台南市中西區」取出縣市 */
/**
 * 每天一個顏色。
 * 試過沿整趟做色相漸移，但 60 天攤開後相鄰兩天只差 4 度，根本分不出換日。
 * 改成八色循環：相鄰的日子一定差很多，同色要隔八天才重複，
 * 而那時他已經走到島的另一邊，地圖上不會誤認。
 */
const DAY_COLORS = [
  '#0B6E4F',  // 深綠
  '#B4472E',  // 磚紅
  '#2C5AA0',  // 靛藍
  '#A8770E',  // 土黃
  '#6E3A8C',  // 紫
  '#147C7C',  // 藍綠
  '#8C2F5B',  // 酒紅
  '#4A6B1F'   // 橄欖
];

function dayColor(g){
  return DAY_COLORS[((g.no || 1) - 1) % DAY_COLORS.length];
}

function cityOf(addr){
  const m = String(addr || '').match(/^(.{2,3}?[縣市])/);
  return m ? m[1] : '';
}

/**
 * 把天數分段。兩種切法：
 *   city 依縣市——環島本來就是一段一段的縣市，看得出「走到哪裡了」
 *   week 依週——看得出「走多久了」，節奏比較均勻
 */
function buildLegs(){
  return GROUP === 'week' ? legsByWeek() : legsByCity();
}

function legsByCity(){
  const legs = [];
  DAYS.forEach(function(g){
    // 一天可能跨縣市，用當天出現最多次的那個當代表
    const tally = {};
    g.pts.forEach(function(p){
      const c = cityOf(p.addr);
      if (c) tally[c] = (tally[c] || 0) + 1;
    });
    const city = Object.keys(tally).sort(function(a,b){ return tally[b] - tally[a]; })[0] || '路上';
    const prev = legs[legs.length - 1];
    if (prev && prev.city === city) { prev.days.push(g); prev.km += g.km; }
    else legs.push({ city: city, days: [g], km: g.km });
  });
  legs.forEach(function(L){
    L.id = 'C' + L.days[0].no;
    L.sub = L.days.length + ' 天 · ' + round1(L.km) + ' km';
  });
  return legs;
}

function legsByWeek(){
  const map = {};
  DAYS.forEach(function(g){
    const w = Math.ceil(g.no / 7);
    if (!map[w]) map[w] = { week: w, days: [], km: 0 };
    map[w].days.push(g);
    map[w].km += g.km;
  });
  return Object.keys(map).map(Number).sort(function(a,b){ return a - b; }).map(function(w){
    const L = map[w];
    const a = L.days[0].date, b = L.days[L.days.length - 1].date;
    L.city = '第 ' + w + ' 週';
    L.id = 'W' + w;
    L.sub = (a.getMonth()+1) + '/' + a.getDate() +
            (L.days.length > 1 ? '–' + (b.getMonth()+1) + '/' + b.getDate() : '') +
            ' · ' + round1(L.km) + ' km';
    return L;
  });
}

function renderAll(){ LEGS = buildLegs(); drawChips(); drawMap(); drawHead(); drawFeed(); }

function drawChips(){
  const shots = photoCount();
  const msgs = msgsFor('').length;
  let html = '<button class="chip" data-d="board" aria-pressed="' + (sel === 'board') + '">留言<em>' +
             msgs + ' 則</em></button>' +
             '<button class="chip" data-d="wall" aria-pressed="' + (sel === 'wall') + '">照片<em>' +
             shots + ' 張</em></button>' +
             '<button class="chip" data-d="all" aria-pressed="' + (sel === null) + '">全程<em>' +
             DAYS.length + ' 天</em></button>' +
             (DAYS.length ? '<button class="chip mode" id="grpBtn">' +
               (GROUP === 'week' ? '依週' : '依縣市') + '<em>換一種看</em></button>' : '');

  // 縣市由新到舊；正在看的那一段展開成日期
  const openLeg = legOfSel();
  LEGS.slice().reverse().forEach(function(L){
    const on = (typeof sel === 'string' && sel.indexOf('leg:') === 0 && sel === 'leg:' + L.id);
    html += '<button class="chip city" data-d="leg:' + L.id + '" aria-pressed="' + on + '">' +
            esc(L.city) + '<em>' + esc(L.sub) + '</em></button>';
    if (openLeg && openLeg.id === L.id) {
      L.days.slice().reverse().forEach(function(g){
        html += '<button class="chip day" data-d="' + g.no + '" aria-pressed="' + (sel === g.no) +
                '"><span class="dot" style="background:' + dayColor(g) + '"></span>第 ' + g.no +
                ' 天<em>' + (g.date.getMonth()+1) + '/' + g.date.getDate() + '</em></button>';
      });
    }
  });

  $('days').innerHTML = html;
  $('days').querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click', function(){
      const d = b.dataset.d;
      sel = d === 'all' ? null
          : (d === 'wall' || d === 'board' || d.indexOf('leg:') === 0) ? d
          : Number(d);
      history.replaceState(null, '',
        sel === null ? '#all' : sel === 'wall' ? '#photos' : sel === 'board' ? '#board'
        : typeof sel === 'string' ? '#' + sel : '#d' + sel);
      refit = true;
      renderAll();
      refit = false;
      $('scroll').scrollTop = 0;
    });
  });
  const gb = document.getElementById('grpBtn');
  if (gb) gb.addEventListener('click', function(){
    GROUP = (GROUP === 'week') ? 'city' : 'week';
    localStorage.setItem('digua_group', GROUP);
    if (typeof sel === 'string' && sel.indexOf('leg:') === 0) sel = null;   // 段落 id 換算法了
    refit = true;
    renderAll();
    refit = false;
  });

  const on = $('days').querySelector('[aria-pressed=true]');
  if (on) on.scrollIntoView({ inline:'center', block:'nearest' });
}

/** 目前選擇落在哪一段縣市 */
function legOfSel(){
  if (typeof sel === 'string' && sel.indexOf('leg:') === 0) {
    return LEGS.filter(function(L){ return 'leg:' + L.id === sel; })[0];
  }
  if (typeof sel === 'number') {
    return LEGS.filter(function(L){
      return L.days.some(function(g){ return g.no === sel; });
    })[0];
  }
  return null;
}

/** 目前要顯示哪些天 */
function shownDays(){
  if (sel === null || sel === 'wall' || sel === 'board') return DAYS;
  if (typeof sel === 'string' && sel.indexOf('leg:') === 0) {
    const L = legOfSel();
    return L ? L.days : DAYS;
  }
  const g = dayOf(sel);
  return g ? [g] : DAYS;
}

function drawMap(){
  layer.clearLayers();
  const all = (DATA.points || []).map(function(p){ return [p.lat, p.lng]; });
  const shown = shownDays();
  const pts = shown.reduce(function(a, g){ return a.concat(g.pts); }, []);
  const line = pts.map(function(p){ return [p.lat, p.lng]; });

  // 只看某一天時，其餘路線淡淡留著當底
  if (sel !== null && sel !== 'wall' && sel !== 'board' && all.length > 1) {
    L.polyline(all, { color:'#9AA39C', weight:3, opacity:.5 }).addTo(layer);
  }
  // 逐日上色，白色外框墊底維持在圖磚上的對比
  shown.forEach(function(g){
    const seg = g.pts.map(function(p){ return [p.lat, p.lng]; });
    if (seg.length < 2) return;
    L.polyline(seg, { color:'#ffffff', weight:8, opacity:.95 }).addTo(layer);
    L.polyline(seg, { color: dayColor(g), weight:3.8 })
      .bindTooltip('第 ' + g.no + ' 天　' + round1(g.km) + ' km', { sticky:true })
      .addTo(layer);
  });

  // 隔夜的接續用細虛線帶過，不假裝是連續走的
  for (let i = 1; i < shown.length; i++) {
    const a = shown[i-1].pts[shown[i-1].pts.length - 1];
    const b = shown[i].pts[0];
    if (!a || !b) continue;
    L.polyline([[a.lat, a.lng], [b.lat, b.lng]],
      { color:'#9AA39C', weight:2, opacity:.7, dashArray:'4 6' }).addTo(layer);
  }

  const newest = (DATA.points || [])[(DATA.points || []).length - 1];
  pts.forEach(function(p){
    const isNow = newest && p.t === newest.t;
    const size = isNow ? 48 : 11;
    const html = isNow
      ? '<div class="here" style="width:48px;height:48px">' +
        '<img class="avatar" src="' + FACES[FACE] + '" alt="陳地瓜"></div>'
      : '<div class="pin" style="width:11px;height:11px;background:' +
        (COLORS[p.type] || '#1F2622') + '"></div>';
    L.marker([p.lat, p.lng], {
      zIndexOffset: isNow ? 1000 : 0,
      icon: L.divIcon({ className:'', html:html, iconSize:[size,size], iconAnchor:[size/2, size/2] })
    }).bindPopup(popup(p), { maxWidth:250 }).addTo(layer);
  });

  if (refit && line.length) {
    map.fitBounds(L.latLngBounds(line).pad(line.length > 1 ? 0.25 : 3));
  }
}

function drawHead(){
  const pts = DATA.points || [];
  const g = (typeof sel === 'number') ? dayOf(sel) : null;
  const L = (typeof sel === 'string' && sel.indexOf('leg:') === 0) ? legOfSel() : null;
  if (!pts.length) {
    document.querySelector('.milestone').innerHTML =
      '<div class="km">0<i>km</i></div><div class="sub">' + startLabel() + '出發</div>';
  } else {
    document.querySelector('.milestone').innerHTML =
      '<div class="km">' + (g ? round1(g.km) : L ? round1(L.km) : DATA.totalKm) + '<i>km</i></div>' +
      '<div class="sub">' + (g ? '第 ' + g.no + ' 天'
        : L ? L.city + '　' + L.days.length + ' 天'
        : '全程 ' + DATA.day + ' 天') + '　路線距離</div>';
  }

  if (!pts.length) {
    const d = untilStart();
    $('label').textContent = '出發日';
    $('place').textContent = startLabel();
    $('badge').hidden = true;
    $('when').textContent = d > 0 ? '還有 ' + d + ' 天' : (d === 0 ? '今天上路' : '準備中');
    $('foot').textContent = BUILD;
    return;
  }
  const last = pts[pts.length - 1];
  $('label').textContent = last.type === '收工' ? '今天走到這裡' : '地瓜現在在';
  $('place').textContent = short(last.addr) || '定位中';
  const g0 = DAYS[DAYS.length - 1];
  const live = g0 && sameDay(g0.date);
  const b = $('badge');
  if (live) {
    b.hidden = false;
    b.className = 'badge ' + (g0.done ? 'done' : g0.resting ? 'resting' : 'walking');
    b.textContent = g0.done ? '今天收工' : '在路上';
  } else {
    b.hidden = true;
  }

  $('when').innerHTML = esc(fullTime(last.t)) + '　' + ago(last.t) +
    (last.wx ? '　·　' + esc(last.wx) : '') +
    (live ? '<br>' + (g0.done ? '今天在路上 ' + hm(g0.walkMin) + '，收工了'
                              : '今天在路上 ' + hm(g0.walkMin)) : '');
  $('foot').textContent = '最後更新 ' + hhmm(DATA.updated) + '　·　' + BUILD;
}

function drawFeed(){
  if (sel === 'wall') { drawWall(); return; }
  if (sel === 'board') { drawBoard(); return; }
  const shown = shownDays().slice().reverse();
  if (!shown.length) {
    $('list').innerHTML = '<p class="empty">陳地瓜 ' + startLabel() +
      '從台南出發，順時針徒步環島一圈。<br>上路之後，這裡會長出一條路——每天走到哪、' +
      '沿途拍了什麼，都會留在這頁。</p>';
    return;
  }
  $('list').innerHTML = shown.map(dayBlock).join('');
  bindPhotos();
}

function photoStrip(list, dayNo, p){
  if (!list.length) return '';
  const cap = '第 ' + dayNo + ' 天　' + hhmm(p.t) + '　' + esc(short(p.addr));
  if (list.length === 1) {
    return imgTag(list[0], cap);
  }
  return '<div class="strip">' + list.map(function(ph){ return imgTag(ph, cap); }).join('') + '</div>';
}

function imgTag(ph, cap){
  const n = ph.pid ? msgsFor('photo:' + ph.pid).length : 0;
  const img = '<img loading="lazy" src="' + thumbOf(ph.pid, ph.url) + '" data-full="' + ph.url +
              '" data-pid="' + esc(ph.pid) + '" data-cap="' + cap + '" alt="">';
  return n ? '<span class="ph">' + img + '<b>' + n + '</b></span>' : img;
}

function photoCount(){
  return DAYS.reduce(function(n, g){
    return n + g.pts.reduce(function(k, p){ return k + photosOf(p).length; }, 0);
  }, 0);
}

/** target 為空的是留言板，'photo:<id>' 的掛在照片下 */
function msgsFor(target){
  return (DATA.msgs || []).filter(function(m){ return (m.target || '') === target; });
}

function drawBoard(){
  const list = msgsFor('');

  // 輸入框只建一次。每 60 秒的自動更新只換下面的留言，
  // 不碰上面的表單，打到一半才不會被洗掉。
  if (!document.getElementById('mList')) {
    $('list').innerHTML =
      '<div class="board"><div class="compose">' +
      '<input id="mName" maxlength="20" placeholder="你的名字" autocomplete="name" value="' +
        esc(localStorage.getItem('digua_name') || '') + '">' +
      '<textarea id="mText" maxlength="300" placeholder="想跟地瓜說的話。他每次打卡都看得到。"></textarea>' +
      '<button id="mGo">留言給地瓜</button>' +
      '<p class="hint" id="mHint">留言是公開的，所有人都看得到。</p>' +
      '</div><div id="mList"></div></div>';
    $('mGo').addEventListener('click', sendMsg);
    $('mText').addEventListener('input', function(){
      $('mHint').className = 'hint';
      $('mHint').textContent = '留言是公開的，所有人都看得到。';
    });
  }

  if (!list.length) {
    $('mList').innerHTML = '<p class="empty">還沒有人留言。第一句話留給你。</p>';
    return;
  }
  $('mList').innerHTML = list.slice().reverse().map(function(m){
    return '<div class="msg"><div class="who">' + esc(m.name) +
           '<span>' + fullTime(m.t) + '</span></div>' +
           '<div class="txt">' + esc(m.text) + '</div></div>';
  }).join('');
}

function sendMsg(){
  const name = $('mName').value.trim();
  const text = $('mText').value.trim();
  const hint = $('mHint');
  if (!name || !text) {
    hint.className = 'hint err';
    hint.textContent = name ? '還沒寫內容。' : '留個名字，地瓜才知道是誰。';
    return;
  }
  localStorage.setItem('digua_name', name);
  $('mGo').disabled = true;
  $('mGo').textContent = '送出中…';

  fetch(API_URL, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'message', name:name, text:text })
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    if (res && res.ok) {
      $('mText').value = '';
      $('mText').blur();
      $('mGo').disabled = false;
      $('mGo').textContent = '留言給地瓜';
      $('mHint').className = 'hint';
      $('mHint').textContent = '留言送出了，地瓜下次打卡就會看到。';
      refit = false;
      load();
    }
    else {
      hint.className = 'hint err';
      hint.textContent = (res && res.error) || '送出失敗，再試一次。';
      $('mGo').disabled = false; $('mGo').textContent = '留言給地瓜';
    }
  })
  .catch(function(){
    hint.className = 'hint err';
    hint.textContent = '連不上伺服器，等一下再試。';
    $('mGo').disabled = false; $('mGo').textContent = '留言給地瓜';
  });
}

function drawWall(){
  if (!photoCount()) {
    $('list').innerHTML = '<p class="empty">還沒有照片。地瓜路上按「打卡」拍的每一張，都會落在這裡。</p>';
    return;
  }
  let html = '<p class="wallhead">' + photoCount() + ' 張，由新到舊。點一下放大。</p><div class="wall">';
  DAYS.slice().reverse().forEach(function(g){
    const shots = [];
    g.pts.slice().reverse().forEach(function(p){
      photosOf(p).forEach(function(ph){ shots.push({ p:p, ph:ph }); });
    });
    if (!shots.length) return;
    html += '<p class="day">第 ' + g.no + ' 天　' + longDate(g.date) + '</p>';
    shots.forEach(function(x){
      html += imgTag(x.ph, '第 ' + g.no + ' 天　' + hhmm(x.p.t) + '　' + esc(short(x.p.addr)) +
              (x.p.note ? '　' + esc(x.p.note) : ''));
    });
  });
  $('list').innerHTML = html + '</div>';
  bindPhotos();
}

/** 牆上用小圖，點開才載大圖 */
/** 牆上與日記用小圖，點開才載大圖 */
function thumbOf(pid, url){
  return pid ? 'https://drive.google.com/thumbnail?id=' + pid + '&sz=w400' : url;
}
function photosOf(p){
  const urls = p.photos || (p.photo ? [p.photo] : []);
  const pids = p.pids || (p.pid ? [p.pid] : []);
  return urls.map(function(u, i){ return { url:u, pid:pids[i] || '' }; });
}

function dayBlock(g){
  let h = '<section class="day" style="border-left:4px solid ' + dayColor(g) +
          ';padding-left:14px;margin-left:-18px"><div class="dayhead">' +
          '<span class="n">第 ' + g.no + ' 天</span>' +
          '<span class="date">' + longDate(g.date) + '</span></div>';

  if (g.from && g.to && short(g.from) !== short(g.to)) {
    h += '<p class="route">' + esc(short(g.from)) + '<span>→</span>' + esc(short(g.to)) + '</p>';
  } else if (g.to) {
    h += '<p class="route">' + esc(short(g.to)) + '</p>';
  }
  h += '<p class="stat">' + round1(g.km) + ' 公里' + (g.manual ? '（實走）' : '') +
       '　·　在路上 ' + hm(g.walkMin) +
       (g.restMin ? '　·　休息 ' + hm(g.restMin) : '') + '</p>';
  h += '<p class="stat" style="margin-top:-8px">打卡 ' + g.pts.length + ' 次　·　照片 ' +
       g.pts.reduce(function(k, p){ return k + photosOf(p).length; }, 0) + ' 張</p>';

  if (g.diary) h += '<p class="diary">' + esc(g.diary) + '</p>';

  g.pts.forEach(function(p){
    const showNote = p.note && p !== g.diaryFrom;
    h += '<div class="entry"><div class="t">' + hhmm(p.t) + '</div>' +
         '<div class="body" style="border-color:' + (COLORS[p.type] || '#C9C3B2') + '">' +
         '<div class="kind" style="color:' + (COLORS[p.type] || '#1F2622') + '">' + esc(p.type) + '</div>' +
         '<div class="addr">' + (esc(short(p.addr)) || '—') + '</div>' +
         (p.wx ? '<div class="wx">' + esc(p.wx) + '</div>' : '') +
         (showNote ? '<div class="note">' + esc(p.note) + '</div>' : '') +
         photoStrip(photosOf(p), g.no, p) +
         '</div></div>';
  });
  return h + '</section>';
}

let LB_PID = '';

function openLb(src, cap, pid){
  LB_PID = pid || '';
  $('lbimg').src = src;
  $('lbcap').textContent = cap || '';
  $('pName').value = localStorage.getItem('digua_name') || '';
  $('pText').value = '';
  $('pHint').textContent = '';
  $('lb').classList.add('on');
  document.body.style.overflow = 'hidden';
  drawLbMsgs();
}

function closeLb(){
  $('lb').classList.remove('on');
  $('lbimg').src = '';
  LB_PID = '';
  document.body.style.overflow = '';
}

function drawLbMsgs(){
  if (!LB_PID) { $('lbList').innerHTML = ''; return; }
  const list = msgsFor('photo:' + LB_PID);
  $('lbList').innerHTML = list.length
    ? list.map(function(m){
        return '<div class="msg"><div class="who">' + esc(m.name) +
               '<span>' + fullTime(m.t) + '</span></div>' +
               '<div class="txt">' + esc(m.text) + '</div></div>';
      }).join('')
    : '<p class="cap" style="padding:0 0 14px">還沒有人對這張說話。</p>';
}

$('lbClose').addEventListener('click', closeLb);
$('lb').addEventListener('click', function(e){ if (e.target === $('lb')) closeLb(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeLb(); });

$('pGo').addEventListener('click', function(){
  const name = $('pName').value.trim();
  const text = $('pText').value.trim();
  if (!name || !text) {
    $('pHint').textContent = name ? '還沒寫內容。' : '留個名字吧。';
    return;
  }
  if (!LB_PID) { $('pHint').textContent = '這張照片還沒有編號，暫時不能留言。'; return; }
  localStorage.setItem('digua_name', name);
  $('pGo').disabled = true; $('pGo').textContent = '送出中…';

  fetch(API_URL, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'message', name:name, text:text, target:'photo:' + LB_PID })
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    $('pGo').disabled = false; $('pGo').textContent = '留言';
    if (res && res.ok) {
      $('pText').value = '';
      $('pHint').textContent = '留言送出了。';
      refit = false;
      load(function(){ drawLbMsgs(); });
    } else {
      $('pHint').textContent = (res && res.error) || '送出失敗，再試一次。';
    }
  })
  .catch(function(){
    $('pGo').disabled = false; $('pGo').textContent = '留言';
    $('pHint').textContent = '連不上伺服器，等一下再試。';
  });
});

function dayOf(no){ return DAYS.filter(function(g){ return g.no === no; })[0]; }
function startDate(){ return new Date(((DATA && DATA.startDate) || '2026-09-05') + 'T00:00:00+08:00'); }
function startLabel(){
  return startDate().toLocaleDateString('zh-TW', { month:'long', day:'numeric', weekday:'short' });
}
function untilStart(){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const s0 = startDate();
  return Math.round((new Date(s0.getFullYear(), s0.getMonth(), s0.getDate()) - today) / 86400000);
}
function round1(n){ return Math.round(n * 10) / 10; }
function short(a){ return String(a == null ? '' : a).replace(/^台灣省?/, '').replace(/^\d{3,5}\s*/, ''); }
function popup(p){
  return '<b>' + esc(p.type) + '</b>　' + hhmm(p.t) + '<br>' + esc(short(p.addr)) +
         (p.note ? '<br>' + esc(p.note) : '') +
         photosOf(p).map(function(ph){
           return '<br><img src="' + thumbOf(ph.pid, ph.url) + '" style="width:100%;margin-top:6px;border-radius:5px">';
         }).join('');
}
function hhmm(iso){
  return new Date(iso).toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false });
}
function fullTime(iso){
  return new Date(iso).toLocaleString('zh-TW', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false });
}
function longDate(d){
  return d.toLocaleDateString('zh-TW', { month:'long', day:'numeric', weekday:'short' });
}
function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 2) return '剛剛';
  if (m < 60) return m + ' 分鐘前';
  const h = Math.round(m / 60);
  if (h < 24) return h + ' 小時前';
  return Math.round(h / 24) + ' 天前';
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}

load();
setInterval(function(){ if (!document.hidden) load(); }, 60000);
